<!DOCTYPE html>
<html lang="en">

<head>
    <title>JioTV + Player</title>
    <meta charset="UTF-8" />
    <meta name="description" content="ENJOY FREE LIVE TV">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    
    <link rel="shortcut icon" type="image/x-icon" href="https://i.ibb.co/BcjC6R8/jiotv.png">

    <script type="text/javascript" src="https://content.jwplatform.com/libraries/IDzF9Zmk.js"></script>

    <style>
        html, body {
            background: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
        }

        #player-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Message to show if no stream URL is provided */
        #error-message {
            color: white;
            font-family: sans-serif;
            text-align: center;
            margin-top: 20%;
            display: none;
        }
    </style>
</head>

<body>

    <div id="player-container">
        <div id="error-message">No stream source detected. Please add ?stream=URL to the address bar.</div>
    </div>

    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Get the current URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            
            // 2. Extract the 'stream' parameter
            const videoUrl = urlParams.get('stream');

            // 3. logic: If stream exists, play it. If not, show error.
            if (videoUrl) {
                const playerConfig = {
                    title: 'Live Stream',
                    description: "JioTV+",
                    image: 'https://jiotv.catchup.cdn.jio.com/dare_images/images/Colors_HD.png',
                    file: videoUrl, // This is now dynamic
                    type: "hls",    // Assuming m3u8 streams
                    autostart: true,
                    mute: false,
                    width: '100%',
                    height: '100%',
                    stretching: 'exactfit',
                    skin: {
                        name: "netflix"
                    },
                    captions: {
                        color: '#fff',
                        fontSize: 16,
                        backgroundOpacity: 0
                    }
                };

                // Initialize JW Player on the div 'player-container'
                jwplayer("player-container").setup(playerConfig);
                
            } else {
                // Show error message if url is missing
                document.getElementById('error-message').style.display = 'block';
                console.error("No stream parameter found in URL");
            }
        });
    </script>
</body>
</html>
